<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Archer Playable</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background: #111;
            font-family: 'Arial Rounded MT Bold', 'Helvetica Neue', sans-serif;
            touch-action: none;
            user-select: none; -webkit-user-select: none;
        }

        #game-wrapper {
            position: relative;
            margin: 0 auto;
            width:  min(100vw, calc(100vh * 9 / 16));
            height: min(100vh, calc(100vw * 16 / 9));
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            overflow: hidden;
            box-shadow: 0 0 60px rgba(0,0,0,0.8);
        }

        #game {
            position: relative;
            width: 100%; height: 100%;
            overflow: hidden;
        }

        .scene {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
        }
        .hidden { display: none !important; }
        
        #start-screen {
            position: absolute; inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 50;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.4s ease;
        }
        
        .custom-play-btn {
            background: linear-gradient(135deg, #ff007c 0%, #ff6b00 100%);
            color: #ffffff;
            font-size: 28px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 18px 55px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 0 #b3004b, 
                        0 15px 25px rgba(255, 0, 124, 0.4), 
                        inset 0 2px 3px rgba(255,255,255,0.4);
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            will-change: transform;
            animation: startButtonPulse 1.2s infinite ease-in-out;
            transition: transform 0.1s ease;
        }
        
        .custom-play-btn:active {
            transform: scale(0.95) translateY(4px);
            box-shadow: 0 4px 0 #b3004b, 
                        0 8px 15px rgba(255, 0, 124, 0.4);
        }

        .bg {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }

        #wheel-wrapper {
            position: relative;
            width: 85%;
            aspect-ratio: 1 / 1;
            margin-top: -15%;
            z-index: 5;
        }
        #wheel-container {
            position: relative; width: 100%; height: 100%;
            will-change: transform; transition: transform 0s;
        }
        #wheel { width: 100%; height: 100%; display: block; }

        .string {
            position: absolute; z-index: 14;
            pointer-events: none;
            transform-origin: 0% 50%;
            height: 25px;
            will-change: width, transform;
        }

        .hay {
            position: absolute;
            width: 25%;
            bottom: 16%;
            transition: transform .2s ease;
            z-index: 15;
        }
        #hay-left  { left: 1%;  transform: rotate(0deg); }
        #hay-right { right: 1%; transform: rotate(180deg); }

        #arrow-area {
            position: absolute;
            width: 35%; aspect-ratio: 1/1;
            left: 50%; bottom: 18%;
            transform: translateX(-50%);
            z-index: 10;
        }
        #arrow {
            width: 100%; height: 100%;
            object-fit: contain;
            will-change: transform;
            cursor: pointer;
        }
        .stuck-arrow {
            position: absolute;
            width: 14%; 
            left: 50%; top: 50%;
            z-index: 6;
            transform-origin: 50% 0%; 
        }
        .avatar {
            position: absolute;
            width: 22%;
            bottom: 3%;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .left-main  { left: 5%; }
        .right-main { right: 5%; }
        
        .avatar-img-holder {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 15px;
            overflow: hidden;
            border: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .avatar-img-holder img { width: 100%; height: 100%; object-fit: cover; }
        
        .avatar-label {
            display: none !important;
        }

        #tutorial-hand {
            position: absolute;
            width: 15%;
            aspect-ratio: 1/1;
            left: 55%; bottom: 20%;
            z-index: 25;
            pointer-events: none;
        }

        @keyframes handPull {
            0%   { transform: translateY(0); }
            50%  { transform: translateY(30px); }
            100% { transform: translateY(0); }
        }
        .hand-anim { animation: handPull 1.5s ease-in-out infinite; }
        .arrow-tutorial-anim { animation: handPull 1.5s ease-in-out infinite; }
        
        #mountain-title {
            position: absolute;
            width: 110%; 
            left: 50%;
            transform: translateX(-50%);
            bottom: 70%;
            z-index: 4; 
            pointer-events: none;
        }

        #cta-btn {
            display: none;
            position: absolute;
            width: 80%;
            left: 50%; bottom: 40%;
            transform: translateX(-50%);
            z-index: 35;
            cursor: pointer;
        }
        .video-dimmed {
            filter: brightness(0.4) grayscale(0.3);
            transition: filter 0.8s ease;
        }
        .cta-visible {
            display: block !important;
            animation: ctaPulse 1s infinite;
        }

        #reward-scene video {
            width: 100%; height: 100%; object-fit: cover;
        }

        @keyframes spinContinuous {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }
        .spinning-continuous { animation: spinContinuous 1s linear infinite; }

        @keyframes ctaPulse {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50%       { transform: translateX(-50%) scale(1.06); }
        }
        
        @keyframes startButtonPulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(255, 0, 124, 0.4)); }
            50%      { transform: scale(1.08); filter: drop-shadow(0 0 30px rgba(255, 0, 124, 0.8)); }
        }

        #flash {
            position: absolute; inset: 0;
            background: #fff; opacity: 0;
            pointer-events: none; z-index: 100;
            transition: opacity 0.2s;
        }

        #back-btn {
            position: absolute;
            width: 22%;
            top: 4%; left: 14%;
            z-index: 30;
            animation: ctaPulse 1s infinite;
            cursor: pointer;
        }

        #mute-btn {
            position: absolute;
            top: 4%; right: 4%;
            width: 45px; height: 45px;
            z-index: 60; 
            cursor: pointer;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 20px;
            transition: transform 0.1s, background 0.2s;
        }
        #mute-btn:active {
            transform: scale(0.9);
        }

        /* ========== SECTOR POPUP ========== */
        #sector-popup {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(0.7);
            z-index: 90;
            width: 88%;
            background: linear-gradient(135deg, #1a0030 0%, #3d0060 50%, #1a0030 100%);
            border: 3px solid rgba(255, 80, 200, 0.7);
            border-radius: 22px;
            padding: 22px 20px 18px;
            text-align: center;
            box-shadow:
                0 0 40px rgba(200, 0, 255, 0.5),
                0 0 80px rgba(200, 0, 255, 0.2),
                inset 0 1px 0 rgba(255,255,255,0.15);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #sector-popup.popup-visible {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        #sector-popup .popup-eyebrow {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255, 150, 255, 0.7);
            margin-bottom: 8px;
        }
        #sector-popup .popup-text {
            font-size: clamp(18px, 5.5vw, 28px);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.2;
            color: #ffffff;
            text-shadow:
                0 0 20px rgba(255, 100, 255, 0.8),
                0 2px 4px rgba(0,0,0,0.6);
        }
        #sector-popup .popup-stars {
            margin-top: 10px;
            font-size: 18px;
            letter-spacing: 4px;
        }

        @keyframes popupGlow {
            0%, 100% { box-shadow: 0 0 40px rgba(200,0,255,0.5), 0 0 80px rgba(200,0,255,0.2), inset 0 1px 0 rgba(255,255,255,0.15); }
            50%       { box-shadow: 0 0 60px rgba(255,80,200,0.8), 0 0 120px rgba(200,0,255,0.4), inset 0 1px 0 rgba(255,255,255,0.15); }
        }
        #sector-popup.popup-visible {
            animation: popupGlow 1.5s ease-in-out infinite;
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
</head>
<body>

<div id="game-wrapper">
  <audio id="bg-music" src="assets/background.m4a" loop preload="auto" playsinline></audio>
  <div id="game">
    
    <div id="mute-btn" onclick="toggleMusic(event)">🔊</div>

    <div id="start-screen">
        <button class="custom-play-btn" onclick="startGameFromSplash()">Play</button>
    </div>

    <div id="wheel-scene" class="scene">
        <img class="bg" src="assets/bg.webp" />
        <img id="mountain-title" src="assets/mountain_text.webp" />
        <img id="string-left"  class="string" src="assets/line2.png" />
        <img id="string-right" class="string" src="assets/line1.png" />

        <div id="wheel-wrapper">
            <div id="wheel-container">
                <img id="wheel" src="assets/wheel.webp" />
                <div id="stuck-arrows-layer" style="position:absolute;inset:0;"></div>
            </div>
        </div>

        <div id="tutorial-hand" class="hand-anim hidden">
            <img src="assets/hand.webp" style="width:100%;height:100%;" />
        </div>

        <img id="hay-left"  class="hay" src="assets/hay.png" />
        <img id="hay-right" class="hay" src="assets/hay.png" />

        <div id="arrow-area"><img id="arrow" src="assets/arrow.png" /></div>

        <div id="icon-left" class="avatar left-main">
            <div class="avatar-img-holder"><img src="assets/avatar1.png" /></div>
            <div class="avatar-label">You</div>
        </div>
        <div id="icon-right" class="avatar right-main">
            <div class="avatar-img-holder"><img src="assets/avatar2.png" /></div>
            <div class="avatar-label">Mia</div>
        </div>

        <!-- SECTOR POPUP -->
        <div id="sector-popup">
            <div class="popup-eyebrow">🎯 You unlocked</div>
            <div class="popup-text" id="popup-label"></div>
            <div class="popup-stars">⭐⭐⭐</div>
        </div>
    </div>

    <div id="reward-scene" class="scene hidden">
        <video id="girl-animation" playsinline muted loop></video>
        <img id="back-btn" src="assets/back.png" onclick="resetGame()" />
        <img id="cta-btn"  src="assets/cta.webp" onclick="window.open('https://honeytoon.com/comic-video/teach-me-first?n=','_self')" />
    </div>

    <div id="flash"></div>
  </div>
</div>

<script>
    const girls = {
        mia:   { animation: "assets/MiaDuath.webm",  voice: new Audio("assets/mia.m4a") },
        luna:  { animation: "assets/MiaDauns.webm",  voice: new Audio("assets/MiaDeans.m4a") },
        sofia: { animation: "assets/MiaMilk.webm",   voice: new Audio("assets/MiaMilk.m4a") },
        emma:  { animation: "assets/MiaJump.webm",   voice: new Audio("assets/mia.m4a") }
    };

    const outcomes = [
        { id: "sofia",   angle: 310, label: "Mia spills milk\non herself"        },
        { id: "emma",  angle: 75,  label: "Mia does a\nWild Cowgirl Dance"     },
        { id: "luna", angle: 150, label: "Mia Reverse\nCowgirl"               },
        { id: "mia",  angle: 225, label: "Spicy Dance\nfrom Mia"              }
    ];

    const targetSectorAtTop = 0; 

    let dragging = false, spinning = false, isMusicPlaying = false, gameStarted = false;
    let isMuted = false; 
    let startY = 0, pullDistance = 0;
    let tutInterval = null;

    let unlockedGirls = [];

    const bgMusic        = document.getElementById("bg-music");
    const arrow          = document.getElementById("arrow");
    const wheelContainer = document.getElementById("wheel-container");
    const wheelWrapper   = document.getElementById("wheel-wrapper");
    const lineL          = document.getElementById("string-left");
    const lineR          = document.getElementById("string-right");
    const hand           = document.getElementById("tutorial-hand");
    const wrapper        = document.getElementById("game-wrapper");
    const startScreen    = document.getElementById("start-screen");
    const muteBtn        = document.getElementById("mute-btn");
    const sectorPopup    = document.getElementById("sector-popup");
    const popupLabel     = document.getElementById("popup-label");

    let anchorL = {}, anchorR = {};

    function calcAnchors() {
        const w = wrapper.offsetWidth;
        const h = wrapper.offsetHeight;
        anchorL.x = w * 0.03;  anchorL.y = h * 0.82;
        anchorR.x = w * 0.97;  anchorR.y = h * 0.82;
    }

    function updateLines() {
        const gameRect  = wrapper.getBoundingClientRect();
        const arrowRect = arrow.getBoundingClientRect();
        const tx = arrowRect.left - gameRect.left + arrowRect.width  / 2;
        const ty = arrowRect.top  - gameRect.top  + arrowRect.height * 0.82;
        drawPngLine(lineL, anchorL.x, anchorL.y, tx, ty);
        drawPngLine(lineR, anchorR.x, anchorR.y, tx, ty);
    }

    function drawPngLine(el, x1, y1, x2, y2) {
        const dist  = Math.sqrt((x2-x1)**2 + (y2-y1)**2);
        const angle = Math.atan2(y2-y1, x2-x1) * 180 / Math.PI;
        el.style.left      = x1 + "px";
        el.style.top       = y1 + "px";
        el.style.width     = dist + "px";
        el.style.transform = `rotate(${angle}deg) scaleY(1.4)`;
    }

    function toggleMusic(event) {
        if (event) event.stopPropagation(); 
        isMuted = !isMuted;
        bgMusic.muted = isMuted;
        for (let key in girls) {
            if (girls[key].voice) girls[key].voice.muted = isMuted;
        }
        muteBtn.innerText = isMuted ? "🔇" : "🔊";
    }

    function showSectorPopup(label) {
        // \n → <br> для багаторядкового тексту
        popupLabel.innerHTML = label.replace(/\n/g, "<br>");
        sectorPopup.classList.add("popup-visible");
    }

    function hideSectorPopup() {
        sectorPopup.classList.remove("popup-visible");
    }

    function startGameFromSplash() {
        if (gameStarted) return;
        gameStarted = true;

        bgMusic.play().then(() => {
            isMusicPlaying = true;
            bgMusic.muted = isMuted;
        }).catch(e => console.log(e));

        startScreen.style.opacity = "0";
        setTimeout(() => {
            startScreen.classList.add("hidden");
            hand.classList.remove("hidden");
            arrow.classList.add("arrow-tutorial-anim");
            startTutorialLoop();
        }, 400);
    }

    function startDrag(clientY) {
        if (spinning || !gameStarted) return;
        dragging    = true;
        startY      = clientY;
        pullDistance = 0;
        if (tutInterval) { clearInterval(tutInterval); tutInterval = null; }
        hand.classList.add("hidden");
        arrow.classList.remove("arrow-tutorial-anim");
        wheelContainer.classList.add("spinning-continuous");
    }

    wrapper.addEventListener("pointerdown", e => {
        if (e.target.id === "mute-btn" || e.target.closest("#mute-btn")) return;
        if (spinning || !gameStarted) return;
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        e.preventDefault();
        startDrag(e.clientY);
        try { wrapper.setPointerCapture(e.pointerId); } catch(err) {}
    });

    wrapper.addEventListener("pointermove", e => {
        if (!dragging || !gameStarted) return;
        e.preventDefault();
        if (e.clientY > startY) {
            pullDistance = Math.min(e.clientY - startY, 120);
        } else {
            pullDistance = 0;
        }
        arrow.style.transform = `translateY(${pullDistance}px)`;
        document.getElementById("hay-left").style.transform  = `rotate(${pullDistance / 10}deg)`;
        document.getElementById("hay-right").style.transform = `rotate(${180 - pullDistance / 10}deg)`;
        updateLines();
    });

    wrapper.addEventListener("pointerup", e => {
        if (!dragging) return;
        dragging = false;
        try { wrapper.releasePointerCapture(e.pointerId); } catch(err) {}
        if (pullDistance > 40) fire();
        else resetArrowVisuals();
    });

    wrapper.addEventListener("pointercancel", e => {
        if (!dragging) return;
        dragging = false;
        try { wrapper.releasePointerCapture(e.pointerId); } catch(err) {}
        resetArrowVisuals();
    });

    function resetArrowVisuals() {
        arrow.style.transition = "transform 0.1s ease-out";
        arrow.style.transform  = "translateY(0)";
        wheelContainer.classList.remove("spinning-continuous");
        document.getElementById("hay-left").style.transform  = "rotate(0deg)";
        document.getElementById("hay-right").style.transform = "rotate(180deg)";
        setTimeout(() => { 
            arrow.style.transition = "none"; 
            updateLines();
            if (!spinning && !tutInterval && gameStarted) {
                arrow.classList.add("arrow-tutorial-anim");
                hand.classList.remove("hidden");
                startTutorialLoop();
            }
        }, 100);
    }

    function fire() {
        spinning = true;

        let availableOutcomes = outcomes.filter(o => !unlockedGirls.includes(o.id));
        if (availableOutcomes.length === 0) {
            unlockedGirls = [];
            availableOutcomes = outcomes;
        }

        const result = availableOutcomes[Math.floor(Math.random() * availableOutcomes.length)];
        unlockedGirls.push(result.id);

        arrow.style.transition = "transform 0.2s ease-in, opacity 0.1s 0.1s";
        arrow.style.transform  = `translateY(-60%) scale(0.4)`;
        arrow.style.opacity    = "0";

        setTimeout(() => {
            const style        = window.getComputedStyle(wheelContainer);
            const matrix       = new DOMMatrix(style.transform);
            const currentAngle = Math.atan2(matrix.b, matrix.a) * (180 / Math.PI);

            wheelContainer.classList.remove("spinning-continuous");
            wheelContainer.style.transition = "none";
            wheelContainer.style.transform  = `rotate(${currentAngle}deg)`;

            let delta = targetSectorAtTop - result.angle - currentAngle;
            delta = ((delta % 360) + 360) % 360;
            if (delta < 60) delta += 360;
            const extraSpins = 1440;
            const finalAngle = currentAngle + extraSpins + delta;

            createStuckArrowAt(result.angle);

            requestAnimationFrame(() => {
                wheelContainer.style.transition = "transform 4s cubic-bezier(0.17, 0, 0.05, 1)";
                wheelContainer.style.transform  = `rotate(${finalAngle}deg)`;
            });

            // Показуємо попап коли колесо майже зупинилось (через ~3.8с з 4с анімації)
            setTimeout(() => {
                showSectorPopup(result.label);
            }, 3800);

            // Перехід у reward — ховаємо попап разом з flash
            setTimeout(() => showReward(result.id), 5500);
        }, 200);
    }

    function createStuckArrowAt(sectorAngle) {
        const layer = document.getElementById("stuck-arrows-layer");
        layer.innerHTML = "";

        const wheelPx   = wheelWrapper.offsetWidth;
        const radiusPx  = wheelPx * 0.22;
        const arrowSizePx = wheelPx * 0.26;

        const img = document.createElement("img");
        img.src   = "assets/arrow.png";
        img.className = "stuck-arrow";

        Object.assign(img.style, {
            position:  "absolute",
            width:     arrowSizePx + "px",
            height:    "auto", 
            left:      "50%",
            top:       "50%",
            transform: `translate(-50%, 0%) rotate(${sectorAngle}deg) translateY(-${radiusPx}px) rotate(180deg)`
        });

        layer.appendChild(img);
    }

    function showReward(girlKey) {
        hideSectorPopup(); // ховаємо попап
        document.getElementById("flash").style.opacity = "1";
        if (!isMuted) bgMusic.volume = 0.2;

        setTimeout(() => {
            const girl  = girls[girlKey];
            const video = document.getElementById("girl-animation");
            const cta   = document.getElementById("cta-btn");

            video.src = girl.animation;
            video.classList.remove("video-dimmed");
            cta.classList.remove("cta-visible");

            document.getElementById("wheel-scene").classList.add("hidden");
            document.getElementById("reward-scene").classList.remove("hidden");
            document.getElementById("flash").style.opacity = "0";

            video.load();
            video.playbackRate = 0.6;
            video.play();
           
            setTimeout(() => {
                if (!document.getElementById("reward-scene").classList.contains("hidden")) {
                    video.classList.add("video-dimmed");
                    cta.classList.add("cta-visible");
                }
            }, 800);

            if (girl.voice) {
                girl.voice.load();
                girl.voice.muted = isMuted; 
                girl.voice.play().catch(()=>{});
            }
        }, 200);
    }

    function resetGame() {
        const video = document.getElementById("girl-animation");
        const cta   = document.getElementById("cta-btn");

        hideSectorPopup();
        if (!isMuted) bgMusic.volume = 1.0;
        video.pause(); video.src = "";
        video.classList.remove("video-dimmed");
        cta.classList.remove("cta-visible");

        spinning = false;
        document.getElementById("stuck-arrows-layer").innerHTML = "";
        document.getElementById("reward-scene").classList.add("hidden");
        document.getElementById("wheel-scene").classList.remove("hidden");

        wheelContainer.style.transition = "none";
        wheelContainer.style.transform  = "rotate(0deg)";

        arrow.style.transition = "none";
        arrow.style.opacity    = "1";
        arrow.style.transform  = "translateY(0)";

        document.getElementById("hay-left").style.transform  = "rotate(0deg)";
        document.getElementById("hay-right").style.transform = "rotate(180deg)";
        
        calcAnchors();
        updateLines();
        
        arrow.classList.add("arrow-tutorial-anim");
        hand.classList.remove("hidden");
        startTutorialLoop();
    }

    function startTutorialLoop() {
        tutInterval = setInterval(() => {
            if (!dragging && !spinning && gameStarted) updateLines();
        }, 16);
    }

    window.onload = () => { calcAnchors(); updateLines(); };
    window.onresize = () => { calcAnchors(); updateLines(); };
</script>
</body>
</html>
